services:
  - type: web
    name: nutrilens-api
    env: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24" # Same major as .nvmrc and every package.json "engines" (Node 24 LTS)
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard to your MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true # Signs login tokens; Render creates a random value
      - key: GEMINI_API_KEY
        sync: false # (Optional) Google Gemini API Key for multimodal AI vision
      - key: HF_TOKEN
        sync: false # (Optional) Hugging Face token for open Food-101 vision model
      - key: CORS_ORIGINS
        value: "https://nutrilens-nu-five.vercel.app" # Comma-separated web origins allowed to call the API from the browser; set to your Vercel URL
      - key: DEMO_MODE
        value: "true" # Public showcase demo only. It holds sample data, never real members. Set "false" for a deployment with real users.
