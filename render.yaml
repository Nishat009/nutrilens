services:
  - type: web
    name: nutrilens-api
    env: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20" # Same major as .nvmrc and package.json engines
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard to your MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true # Signs login tokens; Render creates a random value
      - key: GEMINI_API_KEY
        sync: false # (Optional) Google Gemini API Key for multimodal AI vision
      - key: HF_TOKEN
        sync: false # (Optional) Hugging Face token for open Food-101 vision model
      - key: DEMO_MODE
        value: "true" # One-click demo member/admin logins for the live demo
